name: Storefront checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-test
          POSTGRES_DB: emg_readiness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-local-test
      POSTGRES_DB: emg_readiness
      DATABASE_URL: postgresql://postgres:ci-local-test@127.0.0.1:5432/emg_readiness?schema=public
      DIRECT_URL: postgresql://postgres:ci-local-test@127.0.0.1:5432/emg_readiness?schema=public
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate:local
      - run: npm run db:seed:local-mvp
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run test:readiness
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local -- --grep-invert 'visual baseline'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
