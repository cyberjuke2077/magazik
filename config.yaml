sessions:
  count: 10
  work_duration: 7200
  break_duration: 600
  night_break: false

delays:
  chipdip: [15, 30]
  octopart: [10, 20]
  digikey: [10, 20]
  mouser: [10, 20]
  google: [5, 10]

retry:
  max_attempts: 3
  backoff: [60, 300, 900]

sources:
  - name: chipdip
    enabled: false
    priority: 5
  - name: octopart
    enabled: false
    priority: 1
  - name: digikey
    enabled: true
    priority: 1
  - name: mouser
    enabled: false
    priority: 3
  - name: google
    enabled: true
    priority: 2

database:
  sqlite: /Users/lux/Desktop/projects/electromagaz/data/progress.db
  postgresql: ${DATABASE_URL}

logging:
  level: INFO
  file: ./logs/collector-{date}.log
  rotation: daily
  retention: 30
