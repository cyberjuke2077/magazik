sessions:
  count: 10
  work_duration: 7200
  break_duration: 600
  night_break: false

delays:
  nexar: [2, 5]
  chipdip: [15, 30]
  google: [5, 10]
  manufacturer: [10, 20]
  distributor: [10, 15]

retry:
  max_attempts: 3
  backoff: [60, 300, 900]

sources:
  - name: nexar
    enabled: true
    priority: 1
  - name: chipdip
    enabled: true
    priority: 2
  - name: google
    enabled: true
    priority: 3
  - name: manufacturer
    enabled: true
    priority: 4
  - name: distributor
    enabled: true
    priority: 5

database:
  sqlite: ./data/progress.db
  postgresql: ${DATABASE_URL}

logging:
  level: INFO
  file: ./logs/collector-{date}.log
  rotation: daily
  retention: 30
